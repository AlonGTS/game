<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>תפוס את הכוכב!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:none; }
  html,body { height:100%; width:100%; overflow:hidden; position:fixed; }
  body { font-family:'Varela Round',sans-serif; background:#1a0533; height:100vh; width:100vw; }
  canvas#bg { position:fixed; inset:0; z-index:0; pointer-events:none; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; padding:16px; gap:14px; }
  .screen.hidden { display:none; }

  .game-title { font-family:'Fredoka One',cursive; font-size:clamp(38px,11vw,68px); color:#ffe94a; text-shadow:0 0 30px #ffaa00,0 4px 0 #cc8800; text-align:center; animation:titleB 1.8s infinite ease-in-out; }
  @keyframes titleB { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .subtitle { font-size:clamp(14px,3.5vw,20px); color:#c8a8ff; text-align:center; }
  .big-emoji { font-size:clamp(56px,15vw,90px); animation:spinS 4s linear infinite; display:block; line-height:1; }
  @keyframes spinS { to{transform:rotate(360deg)} }
  .slabel { color:#c8a8ff; font-size:clamp(13px,3vw,17px); text-align:center; }

  .player-cards { display:flex; gap:10px; justify-content:center; width:100%; max-width:380px; }
  .player-card { flex:1; background:rgba(255,255,255,0.08); border:2.5px solid rgba(255,255,255,0.15); border-radius:18px; padding:clamp(10px,3vw,16px) 8px; text-align:center; cursor:pointer; transition:all 0.2s; }
  .player-card.selected { border-color:var(--pc); background:var(--pb); box-shadow:0 0 18px var(--pc); }
  .p-emoji { font-size:clamp(28px,8vw,40px); display:block; margin-bottom:4px; }
  .p-name { font-family:'Fredoka One',cursive; font-size:clamp(14px,4vw,18px); }

  .diff-row { display:flex; gap:8px; justify-content:center; }
  .diff-btn { padding:clamp(7px,2vw,10px) clamp(14px,4vw,22px); border-radius:30px; border:2px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.07); color:white; font-family:'Fredoka One',cursive; font-size:clamp(14px,4vw,18px); cursor:pointer; transition:all 0.2s; }
  .diff-btn.sel { border-color:#ffe94a; background:rgba(255,233,74,0.2); color:#ffe94a; }
  .start-btn { background:linear-gradient(135deg,#ffe94a,#ff9a00); border:none; border-radius:50px; padding:clamp(13px,3.5vw,18px) clamp(36px,10vw,56px); font-family:'Fredoka One',cursive; font-size:clamp(20px,5.5vw,28px); color:#1a0533; cursor:pointer; box-shadow:0 6px 28px rgba(255,180,0,0.5); }
  .start-btn:active { transform:scale(0.95); }

  #screen-game { padding:0; justify-content:flex-start; }
  .hud { width:100%; display:flex; align-items:stretch; background:rgba(0,0,0,0.5); flex-shrink:0; z-index:20; }
  .hud-p { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 6px; }
  .hud-p.p1side { border-left:1px solid rgba(255,255,255,0.1); }
  .hud-pname { font-size:clamp(10px,2.5vw,13px); color:rgba(255,255,255,0.55); margin-bottom:2px; }
  .hud-pscore { font-family:'Fredoka One',cursive; font-size:clamp(28px,7vw,38px); line-height:1; }
  .sc1c { color:#ff6eb4; } .sc2c { color:#5bc8ff; }
  .hud-mid { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 12px; min-width:80px; }
  .timer-v { font-family:'Fredoka One',cursive; font-size:clamp(28px,7vw,38px); color:white; line-height:1; }
  .timer-v.urg { color:#ff4444; animation:pulseT 0.35s infinite alternate; }
  @keyframes pulseT { to{transform:scale(1.25)} }
  .level-v { font-size:clamp(9px,2vw,12px); color:rgba(255,255,255,0.4); margin-top:2px; }

  #arena { position:relative; flex:1; width:100%; overflow:hidden; }
  .vline { position:absolute; left:50%; top:0; width:2px; height:100%; background:rgba(255,255,255,0.12); z-index:5; pointer-events:none; }
  .zlabel { position:absolute; top:12px; font-family:'Fredoka One',cursive; font-size:clamp(12px,3vw,16px); color:rgba(255,255,255,0.25); pointer-events:none; z-index:6; }

  .item { position:absolute; display:flex; align-items:center; justify-content:center; cursor:pointer; will-change:transform; z-index:15; border-radius:50%; }
  .pop { position:absolute; pointer-events:none; z-index:30; font-family:'Fredoka One',cursive; font-size:clamp(20px,5vw,28px); animation:floatUp 0.8s ease forwards; white-space:nowrap; }
  @keyframes floatUp { from{opacity:1;transform:translateY(0) scale(1)} to{opacity:0;transform:translateY(-70px) scale(1.5)} }
  .ripple { position:absolute; border-radius:50%; pointer-events:none; z-index:14; animation:rippleO 0.4s ease forwards; }
  @keyframes rippleO { from{opacity:0.6;transform:scale(0.5)} to{opacity:0;transform:scale(2.5)} }

  #countdown { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(26,5,51,0.88); }
  #countdown.hidden { display:none; }
  .cd-n { font-family:'Fredoka One',cursive; font-size:clamp(100px,28vw,160px); color:#ffe94a; text-shadow:0 0 60px #ffaa00; animation:cdPop 0.5s ease; }
  @keyframes cdPop { from{transform:scale(2.2);opacity:0} to{transform:scale(1);opacity:1} }

  #screen-end { gap:12px; }
  .end-title { font-family:'Fredoka One',cursive; font-size:clamp(34px,9vw,54px); color:#ffe94a; text-shadow:0 0 28px #ffaa00; text-align:center; }
  .w-emoji { font-size:clamp(64px,18vw,96px); animation:wB 0.6s infinite alternate ease-in-out; display:block; }
  @keyframes wB { from{transform:scale(1) rotate(-6deg)} to{transform:scale(1.15) rotate(6deg)} }
  .w-txt { font-family:'Fredoka One',cursive; font-size:clamp(20px,5.5vw,30px); text-align:center; }
  .end-cards { display:flex; gap:14px; justify-content:center; }
  .end-card { background:rgba(255,255,255,0.1); border-radius:18px; padding:clamp(12px,3vw,18px) clamp(18px,5vw,28px); text-align:center; min-width:100px; }
  .end-card.win { background:rgba(255,233,74,0.18); border:2.5px solid #ffe94a; }
  .ec-name { font-family:'Fredoka One',cursive; font-size:clamp(15px,4vw,19px); margin-bottom:4px; }
  .ec-num { font-family:'Fredoka One',cursive; font-size:clamp(36px,10vw,50px); }
  .again-btn { background:linear-gradient(135deg,#ffe94a,#ff9a00); border:none; border-radius:50px; padding:clamp(12px,3vw,16px) clamp(36px,10vw,52px); font-family:'Fredoka One',cursive; font-size:clamp(20px,5.5vw,26px); color:#1a0533; cursor:pointer; box-shadow:0 6px 26px rgba(255,180,0,0.5); }
  .again-btn:active { transform:scale(0.95); }
  .cp { position:fixed; pointer-events:none; z-index:200; border-radius:2px; animation:cf var(--d) ease forwards; }
  @keyframes cf { 0%{transform:translateY(-20px) rotate(0);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="countdown" class="hidden"><div class="cd-n" id="cdn">3</div></div>

<div id="screen-start" class="screen">
  <span class="big-emoji">⭐</span>
  <div class="game-title">תפוס את הכוכב!</div>
  <div class="subtitle">לחצו על הכוכבים — אל תיגעו בפצצות!</div>
  <div style="width:100%;max-width:380px">
    <div class="slabel" style="margin-bottom:8px">כמה שחקנים?</div>
    <div class="player-cards">
      <div class="player-card" id="m1" onclick="selMode(1)" style="--pc:#ffe94a;--pb:rgba(255,233,74,0.15)">
        <span class="p-emoji">🧒</span><div class="p-name" style="color:#ffe94a">שחקן אחד</div>
      </div>
      <div class="player-card selected" id="m2" onclick="selMode(2)" style="--pc:#5bc8ff;--pb:rgba(91,200,255,0.15)">
        <span class="p-emoji">👧🧒</span><div class="p-name" style="color:#5bc8ff">שני שחקנים</div>
      </div>
    </div>
  </div>
  <div>
    <div class="slabel" style="margin-bottom:8px">רמת קושי</div>
    <div class="diff-row">
      <button class="diff-btn sel" id="de" onclick="selDiff('easy')">קל 😊</button>
      <button class="diff-btn" id="dm" onclick="selDiff('medium')">בינוני 😤</button>
      <button class="diff-btn" id="dh" onclick="selDiff('hard')">קשה 🔥</button>
    </div>
  </div>
  <button class="start-btn" onclick="startGame()">יאללה נשחק! 🚀</button>
</div>

<div id="screen-game" class="screen hidden">
  <div class="hud">
    <div class="hud-p">
      <div class="hud-pname">שחקן 1</div>
      <div class="hud-pscore sc1c" id="sc1">0</div>
    </div>
    <div class="hud-mid">
      <div class="timer-v" id="tv">30</div>
      <div class="level-v" id="lv">רמה 1</div>
    </div>
    <div class="hud-p p1side" id="p2hud">
      <div class="hud-pname">שחקן 2</div>
      <div class="hud-pscore sc2c" id="sc2">0</div>
    </div>
  </div>
  <div id="arena">
    <div class="vline" id="vl" style="display:none"></div>
    <div class="zlabel" id="zl" style="display:none;right:22%">שחקן 1</div>
    <div class="zlabel" id="zr" style="display:none;left:22%">שחקן 2</div>
  </div>
</div>

<div id="screen-end" class="screen hidden">
  <div class="end-title">המשחק נגמר! 🎉</div>
  <span class="w-emoji" id="we">🏆</span>
  <div class="w-txt" id="wt"></div>
  <div class="end-cards" id="ec"></div>
  <button class="again-btn" onclick="goHome()">שחקו שוב! 🎮</button>
</div>

<script>
(function(){
  const c=document.getElementById('bg'),x=c.getContext('2d');
  c.width=window.innerWidth; c.height=window.innerHeight;
  for(let i=0;i<150;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*0.5+0.1})`;x.beginPath();x.arc(Math.random()*c.width,Math.random()*c.height,Math.random()*1.8+0.3,0,Math.PI*2);x.fill();}
})();

const GOOD=['⭐','🌟','💫','✨','🎯','💎','🍭','🌈','🎁','🦋','🍀','🎈','🍉','🌸','🎀'];
const BAD=['💣','👻','🕷️','💀','🌵','⚡','🦂'];
const DCFG={easy:{spd:1.6,ms:1900,bad:0.13,dur:45},medium:{spd:2.6,ms:1300,bad:0.20,dur:35},hard:{spd:4.0,ms:900,bad:0.28,dur:30}};
const PC=['#ff6eb4','#5bc8ff'];

let mode=2,diff='easy',scores=[0,0],tLeft=30,level=1;
let active=false,spIv,tmIv,raf,items=[],idc=0,aW,aH;

window.selMode=d=>{mode=d;['m1','m2'].forEach((id,i)=>document.getElementById(id).classList.toggle('selected',i+1===d));};
window.selDiff=d=>{diff=d;['easy','medium','hard'].forEach(x=>document.getElementById(x==='easy'?'de':x==='medium'?'dm':'dh').classList.toggle('sel',x===d));};

window.startGame=function(){
  scores=[0,0];level=1;items=[];
  const cfg=DCFG[diff]; tLeft=cfg.dur;
  show('screen-game');hide('screen-start');
  document.getElementById('sc1').textContent='0';
  document.getElementById('sc2').textContent='0';
  document.getElementById('tv').textContent=tLeft;
  document.getElementById('tv').className='timer-v';
  document.getElementById('lv').textContent='רמה 1';
  document.getElementById('p2hud').style.opacity=mode===2?'1':'0';
  const arena=document.getElementById('arena');
  arena.querySelectorAll('.item,.pop,.ripple').forEach(e=>e.remove());
  const show2=mode===2?'block':'none';
  ['vl','zl','zr'].forEach(id=>document.getElementById(id).style.display=show2);
  aW=arena.offsetWidth; aH=arena.offsetHeight;
  runCD(()=>{active=true;spawnOne();spIv=setInterval(spawnOne,cfg.ms);tmIv=setInterval(tick,1000);raf=requestAnimationFrame(loop);});
};

function runCD(cb){
  const el=document.getElementById('countdown'),n=document.getElementById('cdn');
  el.classList.remove('hidden'); let c=3; n.textContent=c;
  const iv=setInterval(()=>{c--;if(c===0){n.textContent='יאללה! 🚀';}else if(c<0){clearInterval(iv);el.classList.add('hidden');cb();}else{n.textContent=c;n.style.animation='none';setTimeout(()=>n.style.animation='',20);}},900);
}

function tick(){
  if(!active)return; tLeft--;
  const te=document.getElementById('tv');
  te.textContent=tLeft; te.className='timer-v'+(tLeft<=5?' urg':'');
  level=Math.min(6,1+Math.floor((DCFG[diff].dur-tLeft)/7));
  document.getElementById('lv').textContent='רמה '+level;
  if(tLeft<=0)endGame();
}

function spawnOne(){
  if(!active)return;
  const arena=document.getElementById('arena');
  aW=arena.offsetWidth; aH=arena.offsetHeight;
  const cfg=DCFG[diff];
  const isBad=Math.random()<cfg.bad+(level-1)*0.025;
  const emoji=(isBad?BAD:GOOD)[Math.floor(Math.random()*(isBad?BAD:GOOD).length)];
  const size=Math.min(74,Math.max(54,aW*0.13));
  let x;
  if(mode===2){const z=Math.random()<0.5?0:1;x=z===0?aW/2+Math.random()*(aW/2-size-8)+4:Math.random()*(aW/2-size-8)+4;}
  else x=Math.random()*(aW-size-10)+5;
  const id='i'+(idc++);
  const el=document.createElement('div');
  el.className='item'; el.id=id;
  el.textContent=emoji;
  el.style.cssText=`width:${size}px;height:${size}px;left:${x}px;top:-${size+10}px;font-size:${Math.round(size*0.72)}px`;
  const wa=20+Math.random()*35,ws=0.018+Math.random()*0.025,wo=Math.random()*Math.PI*2;
  const spd=(cfg.spd+(level-1)*0.35)*(0.8+Math.random()*0.4);
  const data={id,el,x,y:-(size+10),isBad,spd,wa,ws,wo,bx:x,size,caught:false};
  items.push(data);
  arena.appendChild(el);
  el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();const t=e.changedTouches[0];catchIt(id,t.clientX,t.clientY);},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();catchIt(id,e.clientX,e.clientY);});
}

function catchIt(id,cx,cy){
  if(!active)return;
  const item=items.find(i=>i.id===id);
  if(!item||item.caught)return;
  item.caught=true;
  const arena=document.getElementById('arena');
  const rect=arena.getBoundingClientRect();
  const lx=cx-rect.left;
  let player=0;
  if(mode===2) player=lx>aW/2?1:0;
  const pts=item.isBad?-2:1+Math.floor(level/2);
  scores[player]=Math.max(0,scores[player]+pts);
  document.getElementById('sc'+(player+1)).textContent=scores[player];
  const pop=document.createElement('div');
  pop.className='pop';
  pop.style.cssText=`left:${item.x}px;top:${item.y+item.size/2}px;color:${item.isBad?'#ff4444':PC[player]}`;
  pop.textContent=item.isBad?'💥 -2':'⭐ +'+(pts);
  arena.appendChild(pop);
  setTimeout(()=>pop.remove(),850);
  const rip=document.createElement('div'),rs=item.size*1.5;
  rip.className='ripple';
  rip.style.cssText=`width:${rs}px;height:${rs}px;left:${item.x-(rs-item.size)/2}px;top:${item.y-(rs-item.size)/2}px;background:${item.isBad?'rgba(255,68,68,0.4)':PC[player]+'55'}`;
  arena.appendChild(rip);
  setTimeout(()=>rip.remove(),420);
  item.el.remove();
  items=items.filter(i=>i.id!==id);
}

function loop(){
  if(!active)return;
  const t=Date.now()/1000;
  const rm=[];
  items.forEach(item=>{
    if(item.caught)return;
    item.y+=item.spd;
    const wx=item.bx+Math.sin(t*item.ws*60+item.wo)*item.wa;
    item.x=Math.max(0,Math.min(aW-item.size,wx));
    item.el.style.top=item.y+'px';
    item.el.style.left=item.x+'px';
    if(item.y>aH+30)rm.push(item.id);
  });
  rm.forEach(id=>{const it=items.find(i=>i.id===id);if(it)it.el.remove();items=items.filter(i=>i.id!==id);});
  raf=requestAnimationFrame(loop);
}

function endGame(){
  active=false; clearInterval(spIv); clearInterval(tmIv); cancelAnimationFrame(raf);
  items.forEach(i=>i.el.remove()); items=[];
  setTimeout(()=>{
    hide('screen-game'); show('screen-end');
    let emoji='🏆',txt='',wi=0;
    if(mode===1){emoji=scores[0]>=20?'🌟':scores[0]>=10?'😄':'💪';txt=`סיימת עם ${scores[0]} נקודות!`;}
    else{
      if(scores[0]>scores[1]){wi=0;txt='🏆 שחקן 1 ניצח!';}
      else if(scores[1]>scores[0]){wi=1;txt='🏆 שחקן 2 ניצח!';}
      else{txt='🤝 תיקו! שניכם אלופים!';emoji='🤝';}
    }
    document.getElementById('we').textContent=emoji;
    document.getElementById('wt').textContent=txt;
    document.getElementById('wt').style.color=PC[wi];
    document.getElementById('ec').innerHTML=(mode===2?[0,1]:[0]).map(i=>`
      <div class="end-card ${mode===2&&i===wi&&scores[0]!==scores[1]?'win':''}">
        <div class="ec-name" style="color:${PC[i]}">שחקן ${i+1}</div>
        <div class="ec-num" style="color:${PC[i]}">${scores[i]}</div>
      </div>`).join('');
    confetti();
  },300);
}

window.goHome=()=>{hide('screen-end');show('screen-start');document.querySelectorAll('.cp').forEach(e=>e.remove());};

function confetti(){
  const cols=['#ffe94a','#ff6eb4','#5bc8ff','#7fff6e','#ff9a00','#d07fff'];
  for(let i=0;i<90;i++) setTimeout(()=>{
    const el=document.createElement('div');el.className='cp';
    el.style.cssText=`left:${Math.random()*100}vw;top:-20px;background:${cols[Math.floor(Math.random()*cols.length)]};width:${7+Math.random()*9}px;height:${7+Math.random()*9}px;--d:${1.4+Math.random()*2.2}s`;
    document.body.appendChild(el);setTimeout(()=>el.remove(),4000);
  },i*25);
}

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
</script>
</body>
</html>
