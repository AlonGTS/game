<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>תפוס את הכוכב!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Varela+Round&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    font-family: 'Varela Round', sans-serif;
    background: #1a0533;
    overflow: hidden;
    height: 100vh; width: 100vw;
    touch-action: none;
  }

  /* STARS BACKGROUND */
  #bg-stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-star { position: absolute; border-radius: 50%; background: white; animation: twinkle var(--d) infinite alternate ease-in-out; opacity: 0.4; }
  @keyframes twinkle { from { opacity: 0.1; transform: scale(0.8); } to { opacity: 0.7; transform: scale(1.2); } }

  /* SCREENS */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px; }
  .screen.hidden { display: none; }

  /* START SCREEN */
  #screen-start { gap: 20px; }
  .game-title { font-family: 'Fredoka One', cursive; font-size: clamp(42px, 12vw, 72px); color: #ffe94a; text-shadow: 0 0 30px #ffaa00, 0 4px 0 #cc8800; text-align: center; animation: bounce 1.5s infinite ease-in-out; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .subtitle { font-size: clamp(16px, 4vw, 22px); color: #c8a8ff; text-align: center; margin-top: -10px; }
  .big-emoji { font-size: clamp(60px, 18vw, 100px); animation: spin-slow 4s linear infinite; display: block; }
  @keyframes spin-slow { from{transform:rotate(0)} to{transform:rotate(360deg)} }

  .players-section { width: 100%; max-width: 400px; }
  .players-label { color: #c8a8ff; font-size: 16px; text-align: center; margin-bottom: 12px; }
  .player-cards { display: flex; gap: 12px; justify-content: center; }
  .player-card {
    flex: 1; max-width: 160px; background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15); border-radius: 20px;
    padding: 14px 10px; text-align: center; cursor: pointer;
    transition: all 0.2s;
  }
  .player-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.14); }
  .player-card.selected { border-color: var(--pc); background: var(--pb); transform: translateY(-3px); box-shadow: 0 0 20px var(--pc); }
  .player-emoji { font-size: 36px; display: block; margin-bottom: 6px; }
  .player-name { font-family: 'Fredoka One', cursive; font-size: 18px; }

  .difficulty-row { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  .diff-btn {
    padding: 8px 18px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.07); color: white; font-family: 'Fredoka One', cursive;
    font-size: 16px; cursor: pointer; transition: all 0.2s;
  }
  .diff-btn.sel { border-color: #ffe94a; background: rgba(255,233,74,0.2); color: #ffe94a; }
  .diff-label { color: #c8a8ff; font-size: 15px; text-align: center; margin-bottom: 8px; }

  .start-btn {
    background: linear-gradient(135deg, #ffe94a, #ff9a00);
    border: none; border-radius: 50px; padding: 16px 50px;
    font-family: 'Fredoka One', cursive; font-size: clamp(22px, 6vw, 28px);
    color: #1a0533; cursor: pointer; box-shadow: 0 6px 30px rgba(255,180,0,0.5);
    transition: all 0.15s; margin-top: 6px;
  }
  .start-btn:hover { transform: scale(1.05); box-shadow: 0 8px 40px rgba(255,180,0,0.7); }
  .start-btn:active { transform: scale(0.97); }

  /* GAME SCREEN */
  #screen-game { padding: 0; justify-content: flex-start; }

  .hud { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); position: relative; z-index: 20; flex-shrink: 0; }
  .hud-score { display: flex; align-items: center; gap: 8px; }
  .score-box { background: rgba(255,255,255,0.1); border-radius: 14px; padding: 6px 14px; text-align: center; }
  .score-name { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 2px; }
  .score-val { font-family: 'Fredoka One', cursive; font-size: 26px; }
  .score-p1 { color: #ff6eb4; }
  .score-p2 { color: #5bc8ff; }

  .hud-center { text-align: center; }
  .timer-val { font-family: 'Fredoka One', cursive; font-size: 32px; color: white; line-height: 1; }
  .timer-val.urgent { color: #ff4444; animation: pulse-urgent 0.4s infinite alternate; }
  @keyframes pulse-urgent { from{transform:scale(1)} to{transform:scale(1.2)} }
  .level-badge { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

  /* GAME ARENA */
  #arena { position: relative; flex: 1; width: 100%; overflow: hidden; }

  /* FALLING ITEMS */
  .item {
    position: absolute;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
    cursor: pointer;
    transition: transform 0.05s;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    will-change: transform;
    z-index: 15;
  }
  .item:active { transform: scale(0.85) !important; }
  .item.good { animation: wobble 0.3s ease; }
  .item.bad { animation: shake 0.3s ease; }
  @keyframes wobble { 0%{transform:scale(1)} 30%{transform:scale(1.4)} 70%{transform:scale(0.9)} 100%{transform:scale(1)} }
  @keyframes shake { 0%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} 100%{transform:translateX(0)} }

  /* CATCH EFFECT */
  .catch-effect {
    position: absolute; pointer-events: none; z-index: 30;
    font-family: 'Fredoka One', cursive; font-size: 28px;
    animation: float-up 0.8s ease forwards;
  }
  @keyframes float-up { from{opacity:1;transform:translateY(0) scale(1)} to{opacity:0;transform:translateY(-60px) scale(1.4)} }

  /* SPLIT LINE (2 player) */
  .split-line { position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: rgba(255,255,255,0.15); z-index: 5; pointer-events: none; }
  .split-label { position: absolute; top: 10px; font-family: 'Fredoka One', cursive; font-size: 14px; color: rgba(255,255,255,0.3); pointer-events: none; z-index: 6; }
  .split-label.left { left: 25%; transform: translateX(-50%); }
  .split-label.right { left: 75%; transform: translateX(-50%); }

  /* END SCREEN */
  #screen-end { gap: 16px; }
  .end-title { font-family: 'Fredoka One', cursive; font-size: clamp(36px, 10vw, 56px); color: #ffe94a; text-shadow: 0 0 30px #ffaa00; text-align: center; }
  .winner-announce { font-family: 'Fredoka One', cursive; font-size: clamp(22px, 6vw, 32px); text-align: center; color: white; }
  .winner-emoji { font-size: 80px; display: block; animation: winner-bounce 0.6s infinite alternate ease-in-out; }
  @keyframes winner-bounce { from{transform:scale(1) rotate(-5deg)} to{transform:scale(1.15) rotate(5deg)} }

  .end-scores { display: flex; gap: 16px; justify-content: center; }
  .end-score-card { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 16px 24px; text-align: center; min-width: 110px; }
  .end-score-card.winner-card { background: rgba(255,233,74,0.2); border: 2px solid #ffe94a; }
  .end-score-name { font-family: 'Fredoka One', cursive; font-size: 18px; margin-bottom: 4px; }
  .end-score-num { font-family: 'Fredoka One', cursive; font-size: 42px; }

  .again-btn { background: linear-gradient(135deg, #ffe94a, #ff9a00); border: none; border-radius: 50px; padding: 14px 44px; font-family: 'Fredoka One', cursive; font-size: 24px; color: #1a0533; cursor: pointer; box-shadow: 0 6px 30px rgba(255,180,0,0.5); transition: all 0.15s; }
  .again-btn:hover { transform: scale(1.05); }

  /* COUNTDOWN */
  #countdown { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(26,5,51,0.85); }
  #countdown.hidden { display: none; }
  .countdown-num { font-family: 'Fredoka One', cursive; font-size: 140px; color: #ffe94a; text-shadow: 0 0 60px #ffaa00; animation: cd-pop 0.5s ease; }
  @keyframes cd-pop { from{transform:scale(2);opacity:0} to{transform:scale(1);opacity:1} }

  /* CONFETTI */
  .confetti-piece { position: fixed; width: 10px; height: 10px; z-index: 200; pointer-events: none; animation: fall var(--dur) ease forwards; border-radius: 2px; }
  @keyframes fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }
</style>
</head>
<body>

<!-- BG STARS -->
<canvas id="bg-stars"></canvas>

<!-- COUNTDOWN -->
<div id="countdown" class="hidden">
  <div class="countdown-num" id="countdown-num">3</div>
</div>

<!-- START SCREEN -->
<div id="screen-start" class="screen">
  <span class="big-emoji">⭐</span>
  <div class="game-title">תפוס את הכוכב!</div>
  <div class="subtitle">משחק זריזות לשניים</div>

  <div class="players-section">
    <div class="players-label">כמה שחקנים?</div>
    <div class="player-cards">
      <div class="player-card" id="mode-1p" onclick="selectMode(1)"
           style="--pc:#ffe94a;--pb:rgba(255,233,74,0.15)">
        <span class="player-emoji">🧒</span>
        <div class="player-name" style="color:#ffe94a">שחקן אחד</div>
      </div>
      <div class="player-card selected" id="mode-2p" onclick="selectMode(2)"
           style="--pc:#5bc8ff;--pb:rgba(91,200,255,0.15)">
        <span class="player-emoji">👧🧒</span>
        <div class="player-name" style="color:#5bc8ff">שני שחקנים</div>
      </div>
    </div>
  </div>

  <div>
    <div class="diff-label">רמת קושי</div>
    <div class="difficulty-row">
      <button class="diff-btn sel" id="diff-easy" onclick="selectDiff('easy')">קל</button>
      <button class="diff-btn" id="diff-medium" onclick="selectDiff('medium')">בינוני</button>
      <button class="diff-btn" id="diff-hard" onclick="selectDiff('hard')">קשה</button>
    </div>
  </div>

  <button class="start-btn" onclick="startGame()">בואו נשחק! 🚀</button>
</div>

<!-- GAME SCREEN -->
<div id="screen-game" class="screen hidden">
  <div class="hud">
    <div class="hud-score">
      <div class="score-box">
        <div class="score-name" id="p1-hud-name">שחקן 1</div>
        <div class="score-val score-p1" id="score-p1">0</div>
      </div>
    </div>
    <div class="hud-center">
      <div class="timer-val" id="timer-val">30</div>
      <div class="level-badge" id="level-badge">רמה 1</div>
    </div>
    <div class="hud-score">
      <div class="score-box" id="p2-score-box">
        <div class="score-name" id="p2-hud-name">שחקן 2</div>
        <div class="score-val score-p2" id="score-p2">0</div>
      </div>
    </div>
  </div>
  <div id="arena">
    <div class="split-line" id="split-line" style="display:none"></div>
    <div class="split-label left" id="split-label-l" style="display:none"></div>
    <div class="split-label right" id="split-label-r" style="display:none"></div>
  </div>
</div>

<!-- END SCREEN -->
<div id="screen-end" class="screen hidden">
  <div class="end-title" id="end-title">המשחק נגמר!</div>
  <span class="winner-emoji" id="winner-emoji">🏆</span>
  <div class="winner-announce" id="winner-announce"></div>
  <div class="end-scores" id="end-scores"></div>
  <button class="again-btn" onclick="goHome()">שחקו שוב! 🎮</button>
</div>

<script>
// ---- BG STARS ----
const canvas = document.getElementById('bg-stars');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
for (let i = 0; i < 120; i++) {
  ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.6 + 0.1})`;
  ctx.beginPath();
  ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2+0.5, 0, Math.PI*2);
  ctx.fill();
}

// ---- CONFIG ----
const ITEMS = {
  good: ['⭐','🌟','💫','✨','🎯','💎','🍭','🌈','🎁','🦋','🍀','🎈'],
  bad:  ['💣','👻','🕷️','💀','🌵','⚡']
};
const DIFF = {
  easy:   { speed: 1.8, spawnRate: 1800, badChance: 0.15, gameDur: 40 },
  medium: { speed: 2.8, spawnRate: 1300, badChance: 0.22, gameDur: 35 },
  hard:   { speed: 4.2, spawnRate: 900,  badChance: 0.30, gameDur: 30 },
};
const PLAYERS = [
  { name: 'שחקן 1', emoji: '🧒', color: '#ff6eb4' },
  { name: 'שחקן 2', emoji: '👧', color: '#5bc8ff' },
];

let mode = 2, diff = 'easy';
let scores = [0, 0], timer = 30, level = 1;
let gameActive = false, spawnInterval, timerInterval, animFrame;
let fallingItems = [];
let itemIdCounter = 0;
let arenaW, arenaH;

// ---- SETUP ----
window.selectMode = function(m) {
  mode = m;
  document.getElementById('mode-1p').classList.toggle('selected', m===1);
  document.getElementById('mode-2p').classList.toggle('selected', m===2);
};

window.selectDiff = function(d) {
  diff = d;
  ['easy','medium','hard'].forEach(x => document.getElementById('diff-'+x).classList.toggle('sel', x===d));
};

// ---- START ----
window.startGame = function() {
  scores = [0, 0]; level = 1; fallingItems = [];
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-game').classList.remove('hidden');

  const cfg = DIFF[diff];
  timer = cfg.gameDur;

  // Setup HUD
  document.getElementById('p1-hud-name').textContent = PLAYERS[0].name;
  document.getElementById('p2-hud-name').textContent = PLAYERS[1].name;
  document.getElementById('score-p1').textContent = '0';
  document.getElementById('score-p2').textContent = '0';
  const p2box = document.getElementById('p2-score-box');
  p2box.style.display = mode === 2 ? 'block' : 'none';

  // Split line for 2 players
  const sl = document.getElementById('split-line');
  const sll = document.getElementById('split-label-l');
  const slr = document.getElementById('split-label-r');
  sl.style.display = mode===2 ? 'block' : 'none';
  sll.style.display = mode===2 ? 'block' : 'none';
  slr.style.display = mode===2 ? 'block' : 'none';
  sll.textContent = PLAYERS[0].name;
  slr.textContent = PLAYERS[1].name;

  const arena = document.getElementById('arena');
  arena.innerHTML = '';
  arena.appendChild(sl); arena.appendChild(sll); arena.appendChild(slr);
  arenaW = arena.offsetWidth; arenaH = arena.offsetHeight;

  // Countdown then go
  runCountdown(() => {
    gameActive = true;
    spawnItem();
    spawnInterval = setInterval(spawnItem, DIFF[diff].spawnRate);
    timerInterval = setInterval(tick, 1000);
    animFrame = requestAnimationFrame(animateItems);
  });
};

function runCountdown(cb) {
  const el = document.getElementById('countdown');
  const num = document.getElementById('countdown-num');
  el.classList.remove('hidden');
  let n = 3;
  num.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n === 0) { num.textContent = 'יאללה!'; }
    else if (n < 0) { clearInterval(iv); el.classList.add('hidden'); cb(); }
    else { num.textContent = n; num.style.animation = 'none'; setTimeout(()=>num.style.animation='',10); }
  }, 800);
}

// ---- GAME LOOP ----
function tick() {
  if (!gameActive) return;
  timer--;
  const tv = document.getElementById('timer-val');
  tv.textContent = timer;
  tv.className = 'timer-val' + (timer <= 5 ? ' urgent' : '');

  // Level up every 10 seconds
  const cfg = DIFF[diff];
  level = Math.min(5, 1 + Math.floor((cfg.gameDur - timer) / 8));
  document.getElementById('level-badge').textContent = 'רמה ' + level;

  if (timer <= 0) endGame();
}

function spawnItem() {
  if (!gameActive) return;
  const arena = document.getElementById('arena');
  arenaW = arena.offsetWidth; arenaH = arena.offsetHeight;
  const cfg = DIFF[diff];
  const isBad = Math.random() < cfg.badChance + (level - 1) * 0.03;
  const pool = isBad ? ITEMS.bad : ITEMS.good;
  const emoji = pool[Math.floor(Math.random() * pool.length)];

  const size = 60;
  let x;
  if (mode === 2) {
    // Each player gets their zone
    const zone = Math.random() < 0.5 ? 0 : 1;
    if (zone === 0) x = Math.random() * (arenaW/2 - size);
    else x = arenaW/2 + Math.random() * (arenaW/2 - size);
  } else {
    x = Math.random() * (arenaW - size);
  }

  const id = 'item-' + (itemIdCounter++);
  const el = document.createElement('div');
  el.className = 'item';
  el.id = id;
  el.textContent = emoji;
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.left = x + 'px';
  el.style.top = '-70px';

  // Wobble side to side
  const wobbleAmp = 30 + Math.random() * 40;
  const wobbleSpeed = 0.02 + Math.random() * 0.03;
  const wobbleOffset = Math.random() * Math.PI * 2;

  const itemData = {
    id, el, x, y: -70, isBad,
    speed: (cfg.speed + (level-1)*0.4) * (0.85 + Math.random()*0.3),
    wobbleAmp, wobbleSpeed, wobbleOffset, baseX: x,
    caught: false
  };
  fallingItems.push(itemData);
  arena.appendChild(el);

  el.addEventListener('touchstart', (e) => { e.preventDefault(); catchItem(id, e.touches[0]); }, {passive:false});
  el.addEventListener('mousedown', (e) => catchItem(id, e));
}

function catchItem(id, e) {
  if (!gameActive) return;
  const item = fallingItems.find(i => i.id === id);
  if (!item || item.caught) return;
  item.caught = true;

  // Determine which player caught it based on touch position
  let player = 0;
  if (mode === 2) {
    const rect = document.getElementById('arena').getBoundingClientRect();
    const touchX = (e.clientX || e.pageX) - rect.left;
    player = touchX > arenaW / 2 ? 0 : 1;
    // p1 = left half (RTL: right side visually) p2 = right half
    // In RTL layout: left in DOM = right on screen
    player = touchX < arenaW / 2 ? 0 : 1;
  }

  const pts = item.isBad ? -2 : 1 + Math.floor(level / 2);
  scores[player] = Math.max(0, scores[player] + pts);

  document.getElementById('score-p' + (player+1)).textContent = scores[player];

  // Visual feedback
  const arena = document.getElementById('arena');
  const effect = document.createElement('div');
  effect.className = 'catch-effect';
  effect.style.left = (item.x + 30) + 'px';
  effect.style.top = item.y + 'px';
  effect.style.color = item.isBad ? '#ff4444' : PLAYERS[player].color;
  effect.textContent = item.isBad ? '−2 💥' : '+' + pts + ' ⭐';
  arena.appendChild(effect);
  setTimeout(() => effect.remove(), 800);

  // Remove item
  item.el.remove();
  fallingItems = fallingItems.filter(i => i.id !== id);
}

function animateItems() {
  if (!gameActive) return;
  const now = Date.now() / 1000;
  const toRemove = [];
  fallingItems.forEach(item => {
    if (item.caught) return;
    item.y += item.speed;
    const wx = item.baseX + Math.sin(now * item.wobbleSpeed * 60 + item.wobbleOffset) * item.wobbleAmp;
    item.x = Math.max(0, Math.min(arenaW - 60, wx));
    item.el.style.top = item.y + 'px';
    item.el.style.left = item.x + 'px';
    if (item.y > arenaH + 20) toRemove.push(item.id);
  });
  toRemove.forEach(id => {
    const item = fallingItems.find(i => i.id === id);
    if (item) { item.el.remove(); }
    fallingItems = fallingItems.filter(i => i.id !== id);
  });
  animFrame = requestAnimationFrame(animateItems);
}

// ---- END ----
function endGame() {
  gameActive = false;
  clearInterval(spawnInterval);
  clearInterval(timerInterval);
  cancelAnimationFrame(animFrame);
  fallingItems.forEach(i => i.el.remove());
  fallingItems = [];

  setTimeout(() => {
    document.getElementById('screen-game').classList.add('hidden');
    document.getElementById('screen-end').classList.remove('hidden');

    let winnerIdx = 0, winnerEmoji = '🏆', winnerText = '';
    if (mode === 1) {
      winnerText = `${PLAYERS[0].name} קיבל ${scores[0]} נקודות!`;
      winnerEmoji = scores[0] >= 15 ? '🌟' : scores[0] >= 8 ? '😄' : '💪';
    } else {
      if (scores[0] > scores[1]) { winnerIdx = 0; winnerText = `🏆 ${PLAYERS[0].name} ניצח!`; }
      else if (scores[1] > scores[0]) { winnerIdx = 1; winnerText = `🏆 ${PLAYERS[1].name} ניצח!`; }
      else { winnerText = '🤝 תיקו! שניכם מדהימים!'; winnerEmoji = '🤝'; }
    }

    document.getElementById('end-title').textContent = 'המשחק נגמר!';
    document.getElementById('winner-emoji').textContent = winnerEmoji;
    document.getElementById('winner-announce').textContent = winnerText;
    document.getElementById('winner-announce').style.color = PLAYERS[winnerIdx].color;

    const scoresEl = document.getElementById('end-scores');
    if (mode === 2) {
      scoresEl.innerHTML = [0,1].map(i => `
        <div class="end-score-card ${i===winnerIdx&&scores[0]!==scores[1]?'winner-card':''}">
          <div class="end-score-name" style="color:${PLAYERS[i].color}">${PLAYERS[i].emoji} ${PLAYERS[i].name}</div>
          <div class="end-score-num" style="color:${PLAYERS[i].color}">${scores[i]}</div>
        </div>`).join('');
    } else {
      scoresEl.innerHTML = `<div class="end-score-card winner-card">
        <div class="end-score-name" style="color:${PLAYERS[0].color}">${PLAYERS[0].emoji} ${PLAYERS[0].name}</div>
        <div class="end-score-num" style="color:${PLAYERS[0].color}">${scores[0]}</div>
      </div>`;
    }
    spawnConfetti();
  }, 400);
}

window.goHome = function() {
  document.getElementById('screen-end').classList.add('hidden');
  document.getElementById('screen-start').classList.remove('hidden');
  document.querySelectorAll('.confetti-piece').forEach(e=>e.remove());
};

// ---- CONFETTI ----
function spawnConfetti() {
  const colors = ['#ffe94a','#ff6eb4','#5bc8ff','#7fff6e','#ff9a00','#c87fff'];
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random()*100 + 'vw';
      el.style.top = '-20px';
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      el.style.setProperty('--dur', (1.5 + Math.random()*2) + 's');
      el.style.transform = `rotate(${Math.random()*360}deg)`;
      el.style.width = (8 + Math.random()*8) + 'px';
      el.style.height = (8 + Math.random()*8) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 30);
  }
}
</script>
